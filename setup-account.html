<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>تفعيل حساب الإدارة</title><link rel="stylesheet" href="style.css"></head><body data-admin="true"><main><section class="panel narrow"><h1>تفعيل الحساب أو استرجاع كلمة المرور</h1><p>استخدم بريدك المسجل لدى مسؤول الموقع. إنشاء حساب لا يمنح صلاحيات الإدارة تلقائيًا لأي بريد آخر.</p><form id="setupForm"><label>البريد الإلكتروني<input name="email" type="email" autocomplete="email" required></label><label>كلمة مرور جديدة للموقع<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><label>تأكيد كلمة المرور<input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="256" required></label><button id="create">إنشاء الحساب وإرسال التأكيد</button><button type="button" id="reset">نسيت كلمة المرور</button></form><form id="recoveryForm" hidden><label>كلمة المرور الجديدة<input name="password" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><label>تأكيدها<input name="confirm" type="password" minlength="12" maxlength="256" autocomplete="new-password" required></label><button>حفظ كلمة المرور</button></form><p id="result" role="status"></p><a href="index.html">الرجوع لدخول الإدارة</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="shared.js"></script><script src="setup-account.js"></script></body></html>
