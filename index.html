<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>صناع البسمة | الإدارة</title><link rel="stylesheet" href="style.css"></head><body data-admin="true">
<header><img src="assets/logo.jpg" alt="صناع البسمة"><div><strong>صُنّاع البسمة</strong><small>لوحة إدارة المحتوى والطلبات</small></div><button id="logout" hidden>تسجيل الخروج</button></header>
<main><section id="login" class="panel narrow"><h1>دخول الإدارة</h1><p>الحسابات المصرّح لها فقط يمكنها تعديل الموقع.</p><form id="loginForm"><label>اسم المستخدم<input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required placeholder="badr / mohamed / alaa"></label><label>كلمة المرور<input name="password" type="password" autocomplete="current-password" required></label><p id="loginError" class="loginError" role="alert"></p><button class="primary">دخول</button></form></section>
<section id="workspace" hidden><div id="mode" class="banner"></div><nav id="tabs"></nav><div class="toolbar"><h1 id="heading"></h1><input id="search" type="search" placeholder="بحث في القسم"><button id="refresh">تحديث</button><button id="new" class="primary">إضافة</button></div><div class="stats" id="stats"></div><div id="records"></div></section></main>
<dialog id="editor"><form id="editForm"><div class="toolbar"><h2 id="editTitle">تعديل</h2><button type="button" id="close">إغلاق</button></div><div id="fields"></div><p id="formError" role="alert"></p><button class="primary" id="save">حفظ التغييرات</button></form></dialog><p id="message" role="status"></p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.102.0/dist/umd/supabase.js"></script><script src="config.js"></script><script src="shared.js"></script><script src="seed.js"></script><script src="app.js"></script></body></html>
